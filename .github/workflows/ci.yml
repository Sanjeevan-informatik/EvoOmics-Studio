name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: evoomics analyze --input examples/tiny.vcf --format vcf --output results/ci-vcf
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify installed wheel outside source tree
        shell: bash
        run: |
          python -m venv /tmp/evoomics-wheel
          /tmp/evoomics-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/evoomics-wheel/bin/evoomics --version
